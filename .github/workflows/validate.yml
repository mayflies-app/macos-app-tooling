name: Validate common app tools

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        id: workflow-tool
        with:
          path: ${{ runner.temp }}/actionlint/bin/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-1.7.12-go1.26
      - uses: actions/setup-go@v7
        if: steps.workflow-tool.outputs.cache-hit != 'true'
        with:
          go-version: '1.26'
          cache: false
      - name: Install workflow checker
        if: steps.workflow-tool.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/actionlint/bin
          CGO_ENABLED: '0'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: echo "$RUNNER_TEMP/actionlint/bin" >> "$GITHUB_PATH"
      - run: command -v actionlint
      - run: bash scripts/check.sh
      - uses: actions/cache/save@v6
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.workflow-tool.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/actionlint/bin/actionlint
          key: ${{ steps.workflow-tool.outputs.cache-primary-key }}
